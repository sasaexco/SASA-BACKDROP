<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SASA General Meeting 2026 — Event Backdrop</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;cursor:none;background:#1A0008}
body.show-ui{cursor:default}
canvas#bg{position:fixed;inset:0;z-index:0}
.wrap{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:2vh 4vw;transition:opacity .5s}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:900px;width:100%}
.logo{width:clamp(80px,9vw,130px);height:clamp(80px,9vw,130px);border-radius:50%;overflow:hidden;margin-bottom:clamp(1rem,2.5vh,2.5rem);position:relative;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(212,175,55,.3);animation:rp 4s ease-in-out infinite}
.logo-ring2{position:absolute;inset:-11px;border-radius:50%;border:1px solid rgba(212,175,55,.15);animation:rp 4s ease-in-out infinite 1.2s}
@keyframes rp{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.9;transform:scale(1.04)}}
.title{font-family:'Bebas Neue',sans-serif;color:#D4AF37;font-size:clamp(2.8rem,6vw,5.5rem);letter-spacing:.12em;line-height:1.05;margin-bottom:clamp(.3rem,1vh,1rem);text-shadow:0 0 80px rgba(212,175,55,.2),0 2px 4px rgba(0,0,0,.4)}
.motto{font-family:'Playfair Display',serif;font-size:clamp(.75rem,1.5vw,1.2rem);color:rgba(212,175,55,.65);font-style:italic;font-weight:700;letter-spacing:.05em;margin-bottom:clamp(.5rem,1.5vh,1.5rem)}
.org{font-family:'Inter',sans-serif;font-size:clamp(.45rem,.8vw,.65rem);color:rgba(255,248,220,.28);text-transform:uppercase;letter-spacing:.3em;font-weight:600;margin-bottom:clamp(1.5rem,3.5vh,3.5rem)}
.sep{width:clamp(50px,6vw,100px);height:2px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.4),transparent);margin-bottom:clamp(1rem,2.5vh,2.5rem)}
.date{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.2rem,2.5vw,2.2rem);color:rgba(255,248,220,.85);letter-spacing:.15em;margin-bottom:.3rem}
.venue{font-family:'Inter',sans-serif;font-size:clamp(.4rem,.7vw,.55rem);color:rgba(255,248,220,.22);text-transform:uppercase;letter-spacing:.2em;font-weight:500}
.ctrl{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:.8rem;padding:.6rem;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:opacity .3s}
body.show-ui .ctrl{opacity:1}
.btn{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.2);color:#D4AF37;padding:.35rem .9rem;border-radius:5px;font-size:.65rem;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.05em;font-weight:600;transition:all .15s}
.btn:hover{background:rgba(212,175,55,.2)}.btn.on{background:#D4AF37;color:#2A000D}
.keys{position:fixed;bottom:.6rem;right:.8rem;z-index:20;font-size:.42rem;color:rgba(212,175,55,.15);letter-spacing:.04em;opacity:0;transition:opacity .3s;text-align:right;line-height:1.6}
body.show-ui .keys{opacity:1}
.fs{position:fixed;top:.6rem;right:.6rem;z-index:20;background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.1);color:rgba(212,175,55,.4);width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .3s}
body.show-ui .fs{opacity:1}
.fs svg{width:14px;height:14px;fill:currentColor}.fs:hover{background:rgba(212,175,55,.15);color:#D4AF37}
</style>
</head>

var particles=[],rings=[],diamonds=[],waves=[],arcs=[],blobs=[];

function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight;init()}
window.addEventListener('resize',resize);

function init(){
  particles=[];
  var n=Math.floor((W*H)/5500);
  for(var i=0;i<n;i++){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*2.8+0.6,
      vx:(Math.random()-0.5)*0.5,
      vy:-(Math.random()*0.6+0.2),
      o:Math.random()*0.4+0.1,
      ph:Math.random()*Math.PI*2,
      ps:Math.random()*0.015+0.008
    });
  }
  rings=[];
  for(var j=0;j<6;j++){
    rings.push({
      cx:W*(0.15+Math.random()*0.7),cy:H*(0.15+Math.random()*0.7),
      r:Math.random()*40,maxR:Math.min(W,H)*(0.2+Math.random()*0.4),
      sp:0.3+Math.random()*0.4,o:0.12+Math.random()*0.08,
      lw:1+Math.random()*1.2
    });
  }
  diamonds=[];
  for(var k=0;k<10;k++){
    diamonds.push({
      x:Math.random()*W,y:Math.random()*H,
      sz:Math.random()*45+20,
      rot:Math.random()*Math.PI*2,
      rs:(Math.random()-0.5)*0.006,
      vx:(Math.random()-0.5)*0.4,
      vy:(Math.random()-0.5)*0.3,
      o:Math.random()*0.1+0.04
    });
  }
  waves=[];
  for(var w=0;w<6;w++){
    waves.push({
      yBase:H*(0.1+w*0.15),
      amp:H*0.06+Math.random()*H*0.05,
      freq:0.001+Math.random()*0.002,
      phase:Math.random()*Math.PI*2,
      sp:0.008+Math.random()*0.01,
      o:0.07+Math.random()*0.05,
      lw:1+Math.random()*1.2
    });
  }
  arcs=[];
  for(var a=0;a<4;a++){
    arcs.push({
      cx:W*(0.25+Math.random()*0.5),cy:H*(0.25+Math.random()*0.5),
      r:Math.min(W,H)*(0.12+Math.random()*0.25),
      sa:Math.random()*Math.PI*2,
      sw:Math.PI*(0.4+Math.random()*0.8),
      rs:0.003+Math.random()*0.004,
      o:0.1+Math.random()*0.06,
      dir:Math.random()>0.5?1:-1,
      lw:1+Math.random()*0.8
    });
  }
  blobs=[];
  for(var bl=0;bl<4;bl++){
    blobs.push({
      x:W*(0.15+Math.random()*0.7),y:H*(0.15+Math.random()*0.7),
      r:Math.min(W,H)*(0.1+Math.random()*0.15),
      vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.15,
      phase:Math.random()*Math.PI*2,
      o:0.04+Math.random()*0.025
    });
  }
}

function lerp(a,b,t){return a+(b-a)*t}
function lC(c1,c2,t){return[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]}
function rgb(c){return'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'}

function draw(){
  t+=sp;
  gt+=0.001*sp;

  // === GRADIENT CYCLING — faster, more visible ===
  pB+=0.0008*sp; // ~20sec per transition
  if(pB>=1){pB=0;pI=(pI+1)%PAL.length}
  var nI=(pI+1)%PAL.length;
  var sm=pB*pB*(3-2*pB); // smoothstep for organic feel
  var c1=lC(PAL[pI].r1,PAL[nI].r1,sm);
  var c2=lC(PAL[pI].r2,PAL[nI].r2,sm);
  var c3=lC(PAL[pI].r3,PAL[nI].r3,sm);

  // Moving gradient origin
  var gcx=W*0.5+Math.sin(gt*0.8)*W*0.15;
  var gcy=H*0.4+Math.cos(gt*0.6)*H*0.1;
  var g=X.createRadialGradient(gcx,gcy,0,W*0.5,H*0.5,Math.max(W,H)*0.6);
  g.addColorStop(0,rgb(c1));
  g.addColorStop(0.45,rgb(c2));
  g.addColorStop(1,rgb(c3));
  X.fillStyle=g;
  X.fillRect(0,0,W,H);

  // Two wandering ambient glows
  var ax=W*0.35+Math.sin(gt*1.3)*W*0.25;
  var ay=H*0.45+Math.cos(gt)*H*0.2;
  var g2=X.createRadialGradient(ax,ay,0,ax,ay,W*0.35);
  g2.addColorStop(0,'rgba(212,175,55,0.04)');
  g2.addColorStop(1,'transparent');
  X.fillStyle=g2;
  X.fillRect(0,0,W,H);

  var bx=W*0.7+Math.cos(gt*0.7)*W*0.2;
  var by=H*0.3+Math.sin(gt*1.1)*H*0.2;
  var g3=X.createRadialGradient(bx,by,0,bx,by,W*0.28);
  g3.addColorStop(0,'rgba(200,150,50,0.035)');
  g3.addColorStop(1,'transparent');
  X.fillStyle=g3;
  X.fillRect(0,0,W,H);

  // === BLOBS ===
  blobs.forEach(function(bl){
    bl.phase+=0.004*sp;
    bl.x+=bl.vx*sp;bl.y+=bl.vy*sp;
    if(bl.x<-bl.r*2)bl.x=W+bl.r;if(bl.x>W+bl.r*2)bl.x=-bl.r;
    if(bl.y<-bl.r*2)bl.y=H+bl.r;if(bl.y>H+bl.r*2)bl.y=-bl.r;
    var br=bl.r*(0.85+0.15*Math.sin(bl.phase));
    var bg=X.createRadialGradient(bl.x,bl.y,0,bl.x,bl.y,br);
    bg.addColorStop(0,'rgba(212,175,55,'+bl.o+')');
    bg.addColorStop(0.5,'rgba(180,120,40,'+(bl.o*0.4)+')');
    bg.addColorStop(1,'transparent');
    X.fillStyle=bg;
    X.fillRect(bl.x-br,bl.y-br,br*2,br*2);
  });

  // === WAVES ===
  waves.forEach(function(w){
    w.phase+=w.sp*sp;
    X.beginPath();
    for(var x=0;x<=W;x+=2){
      var y=w.yBase+Math.sin(x*w.freq+w.phase)*w.amp+Math.sin(x*w.freq*0.55+w.phase*1.5)*w.amp*0.45+Math.cos(x*w.freq*0.3+w.phase*0.7)*w.amp*0.25;
      if(x===0)X.moveTo(x,y);else X.lineTo(x,y);
    }
    X.strokeStyle='rgba(212,175,55,'+w.o+')';
    X.lineWidth=w.lw;
    X.stroke();
  });

  // === ARCS ===
  arcs.forEach(function(a){
    a.sa+=a.rs*a.dir*sp;
    X.beginPath();X.arc(a.cx,a.cy,a.r,a.sa,a.sa+a.sw);
    X.strokeStyle='rgba(212,175,55,'+a.o+')';X.lineWidth=a.lw;X.stroke();
    X.beginPath();X.arc(a.cx,a.cy,a.r*0.65,a.sa+0.2,a.sa+a.sw-0.2);
    X.strokeStyle='rgba(212,175,55,'+(a.o*0.5)+')';X.lineWidth=a.lw*0.6;X.stroke();
    X.beginPath();X.arc(a.cx,a.cy,a.r*1.2,a.sa-0.15,a.sa+a.sw*0.6);
    X.strokeStyle='rgba(212,175,55,'+(a.o*0.25)+')';X.lineWidth=a.lw*0.4;X.stroke();
  });

  // === RINGS ===
  rings.forEach(function(rn){
    rn.r+=rn.sp*sp;
    if(rn.r>rn.maxR){rn.r=0;rn.cx=W*(0.1+Math.random()*0.8);rn.cy=H*(0.1+Math.random()*0.8)}
    var alpha=rn.o*(1-rn.r/rn.maxR);
    X.beginPath();X.arc(rn.cx,rn.cy,rn.r,0,Math.PI*2);
    X.strokeStyle='rgba(212,175,55,'+alpha+')';X.lineWidth=rn.lw;X.stroke();
    // Second ring echo
    if(rn.r>15){X.beginPath();X.arc(rn.cx,rn.cy,rn.r-12,0,Math.PI*2);
    X.strokeStyle='rgba(212,175,55,'+(alpha*0.35)+')';X.lineWidth=rn.lw*0.5;X.stroke()}
  });

  // === DIAMONDS ===
  diamonds.forEach(function(dm){
    dm.rot+=dm.rs*sp;
    dm.x+=dm.vx*sp;dm.y+=dm.vy*sp;
    if(dm.x<-70)dm.x=W+70;if(dm.x>W+70)dm.x=-70;
    if(dm.y<-70)dm.y=H+70;if(dm.y>H+70)dm.y=-70;
    X.save();X.translate(dm.x,dm.y);X.rotate(dm.rot);
    // Outer
    X.beginPath();X.moveTo(0,-dm.sz);X.lineTo(dm.sz*0.6,0);X.lineTo(0,dm.sz);X.lineTo(-dm.sz*0.6,0);X.closePath();
    X.strokeStyle='rgba(212,175,55,'+dm.o+')';X.lineWidth=1;X.stroke();
    // Mid
    var ms=dm.sz*0.6;
    X.beginPath();X.moveTo(0,-ms);X.lineTo(ms*0.6,0);X.lineTo(0,ms);X.lineTo(-ms*0.6,0);X.closePath();
    X.strokeStyle='rgba(212,175,55,'+(dm.o*0.5)+')';X.lineWidth=0.7;X.stroke();
    // Inner
    var is=dm.sz*0.3;
    X.beginPath();X.moveTo(0,-is);X.lineTo(is*0.6,0);X.lineTo(0,is);X.lineTo(-is*0.6,0);X.closePath();
    X.strokeStyle='rgba(212,175,55,'+(dm.o*0.25)+')';X.lineWidth=0.5;X.stroke();
    X.restore();
  });

  // === PARTICLES ===
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.ph+=p.ps*sp;
    var a=p.o*(0.35+0.65*Math.sin(p.ph));
    X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);
    X.fillStyle='rgba(212,175,55,'+a+')';X.fill();
    // Soft glow around larger particles
    if(p.r>1.8){
      var pg=X.createRadialGradient(p.x,p.y,p.r,p.x,p.y,p.r*4);
      pg.addColorStop(0,'rgba(212,175,55,'+(a*0.15)+')');
      pg.addColorStop(1,'transparent');
      X.fillStyle=pg;X.fillRect(p.x-p.r*4,p.y-p.r*4,p.r*8,p.r*8);
    }
    p.x+=p.vx*sp;p.y+=p.vy*sp;
    if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
  }

  // === LINES ===
  var mD=95;
  for(var i=0;i<particles.length;i++){
    for(var j=i+1;j<particles.length;j++){
      var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
      var d2=dx*dx+dy*dy;
      if(d2<mD*mD){
        X.beginPath();X.moveTo(particles[i].x,particles[i].y);X.lineTo(particles[j].x,particles[j].y);
        X.strokeStyle='rgba(212,175,55,'+(0.06*(1-Math.sqrt(d2)/mD))+')';
        X.lineWidth=0.5;X.stroke();
      }
    }
  }
}

function loop(){
  if(!paused&&!black)draw();
  else if(black){X.fillStyle='#000';X.fillRect(0,0,W,H)}
  requestAnimationFrame(loop);
}
resize();loop();

function togglePause(){paused=!paused;document.getElementById('pBtn').textContent=paused?'\u25B6 PLAY':'\u23F8 PAUSE';document.getElementById('wrap').style.opacity=paused?'0.12':'1'}
function spd(v){sp=v;document.querySelectorAll('#b1,#b2,#b3').forEach(function(b){b.classList.remove('on')});if(v<=0.25)document.getElementById('b1').classList.add('on');else if(v<=0.6)document.getElementById('b2').classList.add('on');else document.getElementById('b3').classList.add('on')}
function toggleBlack(){black=!black;document.getElementById('wrap').style.display=black?'none':'flex';document.getElementById('blkBtn').textContent=black?'\u2600 SHOW':'\u2B1B BLACKOUT';document.getElementById('blkBtn').classList.toggle('on',black)}
function goFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen()}
var ht;document.addEventListener('mousemove',function(){document.body.classList.add('show-ui');clearTimeout(ht);ht=setTimeout(function(){document.body.classList.remove('show-ui')},2500)});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();togglePause()}else if(e.code==='KeyF')goFS();else if(e.code==='KeyB')toggleBlack();else if(e.code==='Digit1')spd(0.25);else if(e.code==='Digit2')spd(0.6);else if(e.code==='Digit3')spd(1.2)});
ht=setTimeout(function(){document.body.classList.remove('show-ui')},3000);
</script>
</body>
</html>
